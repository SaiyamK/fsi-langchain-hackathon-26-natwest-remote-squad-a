[project]
name = "sentinel-ui-api"
version = "0.1.0"
description = "Sentinel analyst workspace API: a thin FastAPI service over sentinel_aml_agent (live stream, cases, human review)"
requires-python = ">=3.11"
# sentinel_aml_agent is a virtual workspace project (not installable), so the API adds its folder to sys.path
# (sentinel_api/__init__.py) and relies on the shared workspace environment for its packages.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sse-starlette>=2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
