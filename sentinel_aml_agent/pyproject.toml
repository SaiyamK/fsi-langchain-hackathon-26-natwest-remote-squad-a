readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "langsmith>=0.4,<1",
    "deepagents>=0.7,<1",
    "pydantic>=2,<3",
    "python-dotenv>=1.0,<2",
    "langgraph-cli[inmem]>=0.4,<1",
    "notebook>=7,<8",
    "networkx>=3,<4",
    "matplotlib>=3.8,<4",
    "ipywidgets>=8,<9",
]
